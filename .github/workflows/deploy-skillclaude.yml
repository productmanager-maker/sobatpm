name: Deploy skillclaude to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'skillclaude/**'
      - 'expert/**'
      - 'index.html'
      - 'tools-recap.html'
      - '.github/workflows/deploy-skillclaude.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            skillclaude/package-lock.json
            expert/package-lock.json

      - name: Install & build skillclaude
        run: npm ci && npm run build
        working-directory: skillclaude

      - name: Install & build expert
        run: npm ci && npm run build
        working-directory: expert

      - name: Assemble Pages output
        run: |
          mkdir -p _site/skillclaude
          mkdir -p _site/expert
          cp index.html _site/index.html
          cp tools-recap.html _site/tools-recap.html
          cp -r skillclaude/dist/. _site/skillclaude/
          cp -r expert/out/. _site/expert/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
