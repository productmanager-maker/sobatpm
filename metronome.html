<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f0eeea;
  --surface: #ffffff;
  --surface2: #e5e2dc;
  --accent: #e05c3a;
  --accent2: #3a8fe0;
  --text: #1a1a1a;
  --muted: #999;
  --border: #ddd;
}

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 0;
}

.app {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  padding: 20px 16px 32px;
  gap: 14px;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding-bottom: 2px;
}
.header-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 0.18em;
  color: var(--text);
}

/* Beat dots */
.beat-dots {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 6px 4px;
  min-height: 54px;
  align-items: center;
}
.dot {
  border-radius: 50%;
  background: var(--surface2);
  border: 2px solid var(--border);
  transition: background 0.07s, box-shadow 0.07s, transform 0.07s;
  flex-shrink: 0;
}
.dot.active { transform: scale(1.15); box-shadow: 0 4px 18px rgba(0,0,0,0.16); }
.dot[data-i="0"].active  { background:#d4873a; border-color:#d4873a; }
.dot[data-i="1"].active  { background:#b8c020; border-color:#b8c020; }
.dot[data-i="2"].active  { background:#3aabe0; border-color:#3aabe0; }
.dot[data-i="3"].active  { background:#b86020; border-color:#b86020; }
.dot[data-i="4"].active  { background:#9b59b6; border-color:#9b59b6; }
.dot[data-i="5"].active  { background:#27ae60; border-color:#27ae60; }
.dot[data-i="6"].active  { background:#e05c3a; border-color:#e05c3a; }
.dot[data-i="7"].active  { background:#2980b9; border-color:#2980b9; }
.dot[data-i="8"].active  { background:#e67e22; border-color:#e67e22; }
.dot[data-i="9"].active  { background:#c0392b; border-color:#c0392b; }

/* BPM Slider */
.slider-wrap {
  position: relative;
  height: 28px;
  display: flex;
  align-items: center;
  padding: 0 2px;
}
.slider-track {
  position: relative;
  width: 100%; height: 6px;
  background: var(--surface2);
  border-radius: 10px;
}
.slider-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: var(--accent2);
  border-radius: 10px;
}
input[type=range].bpm-slider {
  position: absolute; inset: -11px 0;
  opacity: 0; cursor: pointer;
  width: 100%; height: 28px; margin: 0;
  -webkit-appearance: none;
}
.slider-thumb {
  position: absolute; top: 50%;
  width: 22px; height: 22px;
  background: #fff;
  border: 3px solid var(--accent2);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none;
  box-shadow: 0 2px 8px rgba(58,143,224,0.28);
}

/* BPM section */
.bpm-section {
  display: flex; align-items: center; gap: 10px;
}
.adj-group { display: flex; flex-direction: column; gap: 6px; }
.adj-btn {
  width: 54px; height: 44px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--accent2);
  font-family: 'Nunito', sans-serif;
  font-size: 15px; font-weight: 700;
  cursor: pointer;
  transition: all 0.13s;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}
.adj-btn:hover { background: var(--accent2); color: #fff; border-color: var(--accent2); }
.adj-btn:active { transform: scale(0.94); }
.bpm-center {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 2px;
}
.bpm-scroll {
  height: 92px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  overflow: hidden;
}
.bpm-prev, .bpm-next {
  font-size: 20px; font-weight: 700;
  color: var(--muted); line-height: 1.1;
}
.bpm-curr {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 70px; line-height: 1;
  color: var(--text); letter-spacing: 2px;
}
.tempo-name {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted);
}

/* Presets */
.presets {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}
.preset-btn {
  background: var(--surface);
  border: 1.5px solid var(--border);
  color: var(--muted);
  font-family: 'Nunito', sans-serif;
  font-size: 11px; font-weight: 700;
  padding: 8px 0; border-radius: 8px;
  cursor: pointer; transition: all 0.13s;
}
.preset-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.preset-btn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }

/* Beat count */
.beat-count-section {
  background: var(--surface);
  border-radius: 12px;
  padding: 10px 14px;
  border: 1.5px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.beat-count-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted); flex-shrink: 0; width: 34px;
}
.beat-count-btns { display: flex; gap: 4px; flex: 1; }
.beat-count-btn {
  flex: 1; height: 30px;
  border-radius: 7px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  color: var(--muted);
  font-family: 'Nunito', sans-serif;
  font-size: 12px; font-weight: 700;
  cursor: pointer; transition: all 0.13s;
}
.beat-count-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.beat-count-btn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }

/* Play controls — inline, not sticky */
.play-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 10px;
}
.side-btn {
  width: 46px; height: 46px; border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--surface);
  cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.13s; color: var(--muted);
  font-weight: 800; font-family: 'Nunito', sans-serif;
}
.side-btn:hover { border-color: var(--text); color: var(--text); }
.side-btn.active-accent { border-color: var(--accent); color: var(--accent); }
.play-btn {
  width: 72px; height: 72px;
  border-radius: 20px;
  background: var(--accent); border: none; color: #fff;
  font-size: 28px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 20px rgba(224,92,58,0.32);
  transition: all 0.18s;
}
.play-btn:hover { transform: scale(1.05); box-shadow: 0 8px 28px rgba(224,92,58,0.42); }
.play-btn:active { transform: scale(0.95); }
.play-btn.playing { background: #2a2a2a; box-shadow: 0 6px 20px rgba(0,0,0,0.18); }

/* Sound Carousel */
.sound-section {
  background: var(--surface);
  border-radius: 14px;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
}
.section-label {
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 10px;
}
.carousel-wrap {
  position: relative;
  display: flex; align-items: center; gap: 6px;
}
.carousel-arrow {
  width: 30px; height: 30px; flex-shrink: 0;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.13s;
}
.carousel-arrow:hover { background: var(--accent2); border-color: var(--accent2); color: #fff; }
.carousel-viewport {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.carousel-track {
  display: flex;
  gap: 8px;
  transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
}
.sound-card {
  flex-shrink: 0;
  width: calc((100%) / 3 - 6px);
  display: flex; flex-direction: column;
  align-items: center; gap: 4px;
  padding: 10px 6px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  cursor: pointer;
  transition: all 0.15s;
  min-width: 0;
}
.sound-card:hover { border-color: var(--accent); background: #fff; }
.sound-card.active { background: var(--accent); border-color: var(--accent); }
.sound-card .s-icon { font-size: 20px; line-height: 1; }
.sound-card .s-name {
  font-size: 9px; font-weight: 700;
  color: var(--text); text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;
}
.sound-card.active .s-name { color: #fff; }
.carousel-dots {
  display: flex; justify-content: center; gap: 5px; margin-top: 10px;
}
.c-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--border); transition: background 0.2s, width 0.2s;
  cursor: pointer;
}
.c-dot.active { background: var(--accent); width: 14px; border-radius: 3px; }

/* Volume */
.vol-row {
  display: flex; align-items: center; gap: 10px; margin-top: 10px;
}
.vol-label { font-size: 14px; flex-shrink: 0; }
.vol-wrap { flex: 1; position: relative; height: 24px; display: flex; align-items: center; }
.vol-track {
  position: relative; width: 100%; height: 5px;
  background: var(--surface2); border-radius: 10px;
}
.vol-fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: var(--accent); border-radius: 10px; width: 100%;
}
input[type=range].vol-input {
  position: absolute; inset: -10px 0;
  opacity: 0; cursor: pointer; width: 100%; height: 24px; margin: 0;
  -webkit-appearance: none;
}
.vol-thumb {
  position: absolute; top: 50%;
  width: 16px; height: 16px;
  background: #fff; border: 2.5px solid var(--accent);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none; left: 100%;
}

/* beat flash */
.beat-flash {
  position: fixed; inset: 0; pointer-events: none; z-index: 99;
  opacity: 0; background: rgba(224,92,58,0.055);
  transition: opacity 0.04s;
}
.beat-flash.on { opacity: 1; }
</style>
</head>

  <div class="presets" id="presets"></div>

  <div class="beat-count-section">
    <div class="beat-count-label">Bit</div>

  <!-- Play controls: inline, di bawah bit -->
  <div class="play-controls">
    <button class="side-btn active-accent" id="accentBtn" onclick="toggleAccent()" title="Accent beat 1">A</button>

      <div class="carousel-viewport" id="carViewport">
        <div class="carousel-track" id="carTrack"></div>
      </div>
      <button class="carousel-arrow" onclick="carMove(+1)">&#8250;</button>
    </div>
    <div class="carousel-dots" id="carDots"></div>
    <div class="vol-row">
      <span class="vol-label">🔊</span>
      <div class="vol-wrap">
        <div class="vol-track">
          <div class="vol-fill" id="volFill"></div>
          <input type="range" class="vol-input" id="volSlider" min="0" max="1" step="0.01" value="1">
          <div class="vol-thumb" id="volThumb"></div>
        </div>
      </div>
    </div>
  </div>

</div>

// ===== AUDIO UTILS =====
function noiseBuf(ctx, dur) {
  const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

// Decode base64 MP3 to AudioBuffer
let mp3Buffer = null;
async function loadMp3(ctx) {
  if (mp3Buffer) return mp3Buffer;
  const raw = atob(MP3_B64);
  const bytes = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  try {
    mp3Buffer = await ctx.decodeAudioData(bytes.buffer);
  } catch(e) { mp3Buffer = null; }
  return mp3Buffer;
}

function playMp3(ctx, ac) {
  loadMp3(ctx).then(buf => {
    if (!buf) return;
    const src = ctx.createBufferSource();
    const g = ctx.createGain();
    src.buffer = buf;
    src.connect(g); g.connect(ctx.destination);
    // accent = slightly higher gain + pitch
    g.gain.value = volume * (ac ? 1.0 : 0.65);
    src.playbackRate.value = ac ? 1.0 : 0.85;
    src.start();
  });
}

// ===== 15 SOUNDS — index 0 = MP3 default =====
const SOUNDS = [

  { name:'Metro', icon:'🎵', gen(ctx, ac) { playMp3(ctx, ac); }},

  // 1. Stick
  { name:'Stick', icon:'🥢', gen(ctx, ac) {
    const t=ctx.currentTime;
    const o=ctx.createOscillator(), g=ctx.createGain();

    o.frequency.setValueAtTime(ac?3200:2200, t);

    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(volume*(ac?0.5:0.32), t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.03);
    o.start(t); o.stop(t+0.035);

  }},

  // 4. Wood Block
  { name:'Wood', icon:'🪵', gen(ctx, ac) {
    const t=ctx.currentTime;
    const src=ctx.createBufferSource(), g=ctx.createGain();
    const bp=ctx.createBiquadFilter();
    src.buffer=noiseBuf(ctx,0.12); bp.type='bandpass'; bp.frequency.value=ac?1100:750; bp.Q.value=8;
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(volume*(ac?1.1:0.75), t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.1);
    src.start(t); src.stop(t+0.12);
    const o=ctx.createOscillator(), g2=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(ac?320:220, t);
    o.frequency.exponentialRampToValueAtTime(80, t+0.05);
    o.connect(g2); g2.connect(ctx.destination);
    g2.gain.setValueAtTime(volume*(ac?0.4:0.25), t);
    g2.gain.exponentialRampToValueAtTime(0.001, t+0.06);
    o.start(t); o.stop(t+0.07);
  }},

  // 5. Digital Beep
  { name:'Digital', icon:'🔵', gen(ctx, ac) {
    const t=ctx.currentTime;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.value=ac?1047:784;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(volume*(ac?0.5:0.35), t);
    g.gain.setValueAtTime(volume*(ac?0.5:0.35), t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.08);
    o.start(t); o.stop(t+0.09);
  }},

  // 6. Tap
  { name:'Tap', icon:'👆', gen(ctx, ac) {
    const t=ctx.currentTime;
    const src=ctx.createBufferSource(), g=ctx.createGain();
    const lp=ctx.createBiquadFilter();
    src.buffer=noiseBuf(ctx,0.06); lp.type='lowpass'; lp.frequency.value=ac?1800:1200;
    src.connect(lp); lp.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(volume*(ac?0.7:0.45), t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.05);
    src.start(t); src.stop(t+0.06);
  }},

  // 7. Cowbell
  { name:'Cowbell', icon:'🔔', gen(ctx, ac) {
    const t=ctx.currentTime;
    [[562,0.4],[845,0.3],[1130,0.15]].forEach(([f,amp],i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='square'; o.frequency.value=f*(ac?1.3:1);
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(volume*amp*(ac?1:0.65), t);
      g.gain.exponentialRampToValueAtTime(0.001, t+(ac?0.5:0.35)/(i+1));
      o.start(t); o.stop(t+0.6);
    });
  }},

  // 8. Rimshot
  { name:'Rimshot', icon:'🥁', gen(ctx, ac) {
    const t=ctx.currentTime;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='triangle'; o.frequency.value=ac?400:280;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(volume*(ac?0.5:0.3), t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.06);
    o.start(t); o.stop(t+0.07);
    const src=ctx.createBufferSource(), gn=ctx.createGain();
    const bp=ctx.createBiquadFilter();
    src.buffer=noiseBuf(ctx,0.05); bp.type='bandpass'; bp.frequency.value=3000; bp.Q.value=1;
    src.connect(bp); bp.connect(gn); gn.connect(ctx.destination);
    gn.gain.setValueAtTime(volume*(ac?0.4:0.25), t);
    gn.gain.exponentialRampToValueAtTime(0.001, t+0.04);
    src.start(t); src.stop(t+0.05);
  }},

  // 9. Hi-Hat
  { name:'Hi-Hat', icon:'🎶', gen(ctx, ac) {
    const t=ctx.currentTime;
    const src=ctx.createBufferSource(), g=ctx.createGain();
    const hp=ctx.createBiquadFilter();
    src.buffer=noiseBuf(ctx,0.05); hp.type='highpass'; hp.frequency.value=ac?7000:5500;
    src.connect(hp); hp.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(volume*(ac?0.55:0.32), t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.04);
    src.start(t); src.stop(t+0.05);
  }},

  // 10. Ping
  { name:'Ping', icon:'🔕', gen(ctx, ac) {
    const t=ctx.currentTime;
    const freqs=ac?[2093,4186]:[1568,3136];
    freqs.forEach((f,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(volume*(ac?0.35:0.22)/(i+1), t);
      g.gain.exponentialRampToValueAtTime(0.001, t+(ac?0.6:0.4)/(i*0.5+1));
      o.start(t); o.stop(t+0.7);
    });
  }},

  // 11. Clap
  { name:'Clap', icon:'👏', gen(ctx, ac) {
    const t=ctx.currentTime;
    [0, 0.008, 0.016].forEach((delay, i) => {
      const src=ctx.createBufferSource(), g=ctx.createGain();
      const bp=ctx.createBiquadFilter();
      src.buffer=noiseBuf(ctx, 0.06);
      bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=0.8;
      src.connect(bp); bp.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(volume*(ac?0.7:0.45)/(i+1), t+delay);
      g.gain.exponentialRampToValueAtTime(0.001, t+delay+0.05);
      src.start(t+delay); src.stop(t+delay+0.06);
    });
  }},

  // 12. Snap
  { name:'Snap', icon:'🫰', gen(ctx, ac) {
    const t=ctx.currentTime;
    const src=ctx.createBufferSource(), g=ctx.createGain();
    const hp=ctx.createBiquadFilter();
    src.buffer=noiseBuf(ctx,0.04); hp.type='highpass'; hp.frequency.value=2500;
    src.connect(hp); hp.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(volume*(ac?0.65:0.4), t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.03);
    src.start(t); src.stop(t+0.04);
    const o=ctx.createOscillator(), g2=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(ac?900:650, t);
    o.frequency.exponentialRampToValueAtTime(200, t+0.02);
    o.connect(g2); g2.connect(ctx.destination);
    g2.gain.setValueAtTime(volume*(ac?0.3:0.18), t);
    g2.gain.exponentialRampToValueAtTime(0.001, t+0.025);
    o.start(t); o.stop(t+0.03);
  }},

  // 13. Club Clap
  { name:'Club Clap', icon:'🎉', gen(ctx, ac) {
    const t=ctx.currentTime;
    const conv=ctx.createConvolver();
    const irLen=ctx.sampleRate*0.4;
    const irBuf=ctx.createBuffer(2,irLen,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=irBuf.getChannelData(c);for(let i=0;i<irLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/irLen,2);}
    conv.buffer=irBuf;
    [0,0.01,0.02].forEach((delay,i)=>{
      const src=ctx.createBufferSource(), g=ctx.createGain();
      const bp=ctx.createBiquadFilter();
      src.buffer=noiseBuf(ctx,0.08); bp.type='bandpass'; bp.frequency.value=1000; bp.Q.value=0.6;
      src.connect(bp); bp.connect(g); g.connect(conv); conv.connect(ctx.destination);
      g.gain.setValueAtTime(volume*(ac?0.6:0.38)/(i+1), t+delay);
      g.gain.exponentialRampToValueAtTime(0.001, t+delay+0.07);
      src.start(t+delay); src.stop(t+delay+0.08);
    });
  }},

  // 14. Rim Clap
  { name:'Rim Clap', icon:'🤜', gen(ctx, ac) {
    const t=ctx.currentTime;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='triangle'; o.frequency.value=ac?320:220;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(volume*(ac?0.4:0.25), t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.04);
    o.start(t); o.stop(t+0.05);
    [0, 0.007].forEach((delay,i)=>{
      const src=ctx.createBufferSource(), gn=ctx.createGain();
      const bp=ctx.createBiquadFilter();
      src.buffer=noiseBuf(ctx,0.06); bp.type='bandpass'; bp.frequency.value=1400; bp.Q.value=1;
      src.connect(bp); bp.connect(gn); gn.connect(ctx.destination);
      gn.gain.setValueAtTime(volume*(ac?0.5:0.3)/(i+1), t+delay);
      gn.gain.exponentialRampToValueAtTime(0.001, t+delay+0.045);
      src.start(t+delay); src.stop(t+delay+0.06);
    });
  }},

  // 15. 808 Clap
  { name:'808 Clap', icon:'💥', gen(ctx, ac) {
    const t=ctx.currentTime;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(ac?220:160, t);
    o.frequency.exponentialRampToValueAtTime(60, t+0.06);
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(volume*(ac?0.6:0.38), t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.1);
    o.start(t); o.stop(t+0.12);
    [0, 0.009, 0.018].forEach((delay,i)=>{
      const src=ctx.createBufferSource(), gn=ctx.createGain();
      const bp=ctx.createBiquadFilter();
      src.buffer=noiseBuf(ctx,0.07); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=0.5;
      src.connect(bp); bp.connect(gn); gn.connect(ctx.destination);
      gn.gain.setValueAtTime(volume*(ac?0.55:0.35)/(i+1), t+delay);
      gn.gain.exponentialRampToValueAtTime(0.001, t+delay+0.06);
      src.start(t+delay); src.stop(t+delay+0.07);
    });
  }},
];

// ===== CAROUSEL =====
const CARDS_VISIBLE = 3;
let carOffset = 0;

function buildCarousel() {
  const track = document.getElementById('carTrack');
  const dotsEl = document.getElementById('carDots');
  track.innerHTML = ''; dotsEl.innerHTML = '';
  SOUNDS.forEach((s, i) => {
    const card = document.createElement('button');
    card.className = 'sound-card' + (i === currentSound ? ' active' : '');
    card.innerHTML = `<span class="s-icon">${s.icon}</span><span class="s-name">${s.name}</span>`;
    card.onclick = () => selectSound(i);
    track.appendChild(card);
  });
  const pages = Math.ceil(SOUNDS.length / CARDS_VISIBLE);
  for (let p = 0; p < pages; p++) {
    const d = document.createElement('div');
    d.className = 'c-dot' + (p === 0 ? ' active' : '');
    d.onclick = () => { carOffset = p * CARDS_VISIBLE; updateCarousel(); };
    dotsEl.appendChild(d);
  }
  updateCarousel();
}

function updateCarousel() {
  const track = document.getElementById('carTrack');
  const viewport = document.getElementById('carViewport');
  const cardW = viewport.offsetWidth / CARDS_VISIBLE;
  track.style.transform = `translateX(-${carOffset * cardW}px)`;
  track.querySelectorAll('.sound-card').forEach(c => { c.style.width = (cardW - 8) + 'px'; });
  const page = Math.floor(carOffset / CARDS_VISIBLE);
  document.querySelectorAll('.c-dot').forEach((d, i) => d.classList.toggle('active', i === page));
}

function carMove(dir) {
  const maxOffset = SOUNDS.length - CARDS_VISIBLE;
  carOffset = Math.max(0, Math.min(maxOffset, carOffset + dir * CARDS_VISIBLE));
  updateCarousel();
}

function selectSound(i) {
  currentSound = i;
  document.querySelectorAll('.sound-card').forEach((c, j) => c.classList.toggle('active', j === i));
  SOUNDS[i].gen(getCtx(), false);
  const page = Math.floor(i / CARDS_VISIBLE);
  carOffset = page * CARDS_VISIBLE;
  updateCarousel();
}

// ===== AUDIO CTX =====
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// ===== TEMPO =====
function getTempoName(b) {
  let name = TEMPO_MAP[0][1];
  for (const [t,n] of TEMPO_MAP) { if (b >= t) name = n; }
  return name;
}

function updateBpmUI() {
  document.getElementById('bpmCurr').textContent = bpm;
  document.getElementById('bpmPrev').textContent = bpm - 1;
  document.getElementById('bpmNext').textContent = bpm + 1;
  document.getElementById('tempoName').textContent = getTempoName(bpm);
  const pct = (bpm - 40) / (200 - 40) * 100;
  document.getElementById('sliderFill').style.width = pct + '%';
  document.getElementById('sliderThumb').style.left = pct + '%';
  document.getElementById('bpmSlider').value = bpm;
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active', +b.dataset.bpm === bpm);
  });
  if (isPlaying) { clearInterval(intervalId); startInterval(); }
}

function adjustBpm(d) {
  bpm = Math.max(40, Math.min(200, bpm + d));
  updateBpmUI();
}

// ===== PRESETS =====
const presetsEl = document.getElementById('presets');
BPM_PRESETS.forEach(b => {
  const btn = document.createElement('button');
  btn.className = 'preset-btn' + (b===60?' active':'');
  btn.textContent = b; btn.dataset.bpm = b;
  btn.onclick = () => { bpm = b; updateBpmUI(); };
  presetsEl.appendChild(btn);
});

// ===== BEAT COUNT =====
const beatCountEl = document.getElementById('beatCountBtns');
for (let i = 1; i <= 10; i++) {
  const btn = document.createElement('button');
  btn.className = 'beat-count-btn' + (i === beatCount ? ' active' : '');
  btn.textContent = i;
  btn.onclick = () => selectBeatCount(i);
  beatCountEl.appendChild(btn);
}

function selectBeatCount(n) {
  beatCount = n; beatIndex = 0;
  document.querySelectorAll('.beat-count-btn').forEach((b, j) => b.classList.toggle('active', j+1===n));
  renderDots();
}

function renderDots() {
  const container = document.getElementById('beatDots');
  container.innerHTML = '';
  const size = beatCount <= 4 ? 44 : beatCount <= 6 ? 36 : beatCount <= 8 ? 30 : 26;
  for (let i = 0; i < beatCount; i++) {
    const d = document.createElement('div');
    d.className = 'dot'; d.dataset.i = i;
    d.style.width = size+'px'; d.style.height = size+'px';
    container.appendChild(d);
  }
}

// ===== SLIDERS =====
document.getElementById('bpmSlider').addEventListener('input', e => {
  bpm = +e.target.value; updateBpmUI();
});
document.getElementById('volSlider').addEventListener('input', e => {
  volume = +e.target.value;
  const pct = volume * 100;
  document.getElementById('volFill').style.width = pct + '%';
  document.getElementById('volThumb').style.left = pct + '%';
});

// ===== TICK =====
function tick() {
  const ctx = getCtx();
  const ac = accentEnabled && beatIndex === 0;
  SOUNDS[currentSound].gen(ctx, ac);
  document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
  const activeDot = document.querySelector(`.dot[data-i="${beatIndex}"]`);
  if (activeDot) activeDot.classList.add('active');
  beatIndex = (beatIndex + 1) % beatCount;
  const fl = document.getElementById('flash');
  fl.classList.add('on');
  setTimeout(() => fl.classList.remove('on'), 60);
}

function startInterval() {
  tick();
  intervalId = setInterval(tick, 60000 / bpm);
}

function togglePlay() {
  const btn = document.getElementById('playBtn');
  isPlaying = !isPlaying;
  if (isPlaying) {
    beatIndex = 0;
    btn.innerHTML = '■'; btn.classList.add('playing');
    startInterval();
  } else {
    btn.innerHTML = '▶'; btn.classList.remove('playing');
    clearInterval(intervalId);
    document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
  }
}

function toggleAccent() {
  accentEnabled = !accentEnabled;
  document.getElementById('accentBtn').classList.toggle('active-accent', accentEnabled);
}

let taps = [];
function tapTempo() {
  const now = Date.now();
  taps.push(now);
  if (taps.length > 4) taps = taps.slice(-4);
  if (taps.length >= 2) {
    const diffs = [];
    for (let i=1; i<taps.length; i++) diffs.push(taps[i]-taps[i-1]);
    const avg = diffs.reduce((a,b)=>a+b,0)/diffs.length;
    bpm = Math.round(Math.max(40, Math.min(200, 60000/avg)));
    updateBpmUI();
  }
}

// ===== INIT =====
renderDots();
updateBpmUI();
requestAnimationFrame(() => { buildCarousel(); });
window.addEventListener('resize', updateCarousel);

// ===== PWA SERVICE WORKER =====
if ('serviceWorker' in navigator) {
  const swCode = `self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',e=>{e.respondWith(caches.open('asha-v1').then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res&&res.status===200)c.put(e.request,res.clone());return res;}))));});`;
  const swBlob = new Blob([swCode], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
}

// Install prompt
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstallBanner();});
function showInstallBanner(){
  if(document.getElementById('ib'))return;
  const b=document.createElement('div');b.id='ib';
  b.style.cssText='position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#fff;border:1.5px solid #ddd;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,0.12);z-index:200;font-family:Nunito,sans-serif;font-size:13px;font-weight:700;max-width:340px;width:calc(100% - 32px);';
  b.innerHTML='<span style="font-size:20px">📲</span><span style="flex:1;color:#1a1a1a">Install Metronome Asha</span><button onclick="doInstall()" style="background:#e05c3a;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;font-family:Nunito,sans-serif;font-size:12px">Install</button><button onclick="this.parentElement.remove()" style="background:none;border:none;color:#999;cursor:pointer;font-size:18px;padding:0 2px">×</button>';
  document.body.appendChild(b);
}
function doInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;const b=document.getElementById('ib');if(b)b.remove();});}
window.addEventListener('appinstalled',()=>{const b=document.getElementById('ib');if(b)b.remove();deferredPrompt=null;});
</script>
