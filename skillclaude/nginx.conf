server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 $scheme://$http_host/skillclaude/;
    }

    location /skillclaude/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
